<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logarithmic Galaxy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        body { margin: 0; height: 100vh; overflow: hidden; background: #05070a; display: flex; flex-direction: column; align-items: center; font-family: 'Segoe UI', sans-serif; color: white; }
        
        #starfield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { fill: white; animation: twinkle 4s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.7; } }
        .ufo { position: absolute; top: 10%; left: -50px; font-size: 30px; animation: flyUfo 25s linear infinite; }
        .ship { position: absolute; bottom: 15%; right: -50px; font-size: 30px; animation: flyShip 15s linear infinite; }
        .planet { position: absolute; top: 20%; right: 10%; width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); border-radius: 50%; }
        @keyframes flyUfo { 0% { transform: translateX(0); } 100% { transform: translateX(110vw); } }
        @keyframes flyShip { 0% { transform: translateX(0); } 100% { transform: translateX(-110vw); } }

        #ui-top { display: flex; gap: 20px; margin-top: 20px; align-items: center; }
        #score-board { font-size: 1.5em; color: #ffd700; font-weight: bold; }
        #lang-btn { cursor: pointer; background: #4a90e2; padding: 5px 10px; border-radius: 5px; border: none; color: white; }
        .card { background: rgba(30, 42, 62, 0.7); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; width: 90%; max-width: 500px; margin-top: 20px; }
        .equation { font-size: 2em; margin: 20px 0; min-height: 50px; color: #ffd700; }
        button { display: block; width: 100%; margin: 12px 0; padding: 20px; background: rgba(255, 255, 255, 0.08); border: 2px solid #4a90e2; color: white; border-radius: 10px; cursor: pointer; font-size: 1.2em; }
        button:hover:not(:disabled) { background: #4a90e2; }
        
        /* Highlight styles */
        .selected-correct { background: #006400 !important; border-color: #00ff00 !important; }
        .selected-wrong { background: #8b0000 !important; border-color: #ff0000 !important; }
        .next-btn { background: #ffd700 !important; color: #000 !important; border-color: #e6b800 !important; font-weight: bold; }
        
        #feedback { font-size: 1.1em; margin-top: 15px; font-weight: bold; min-height: 50px; }
    </style>
</head>
<body>

<div id="ui-top">
    <div id="score-board">Points: <span id="score">0</span></div>
    <button id="lang-btn" onclick="toggleLang()">中 / EN</button>
</div>

<svg id="starfield"></svg>
<div class="ufo">🛸</div>
<div class="planet"></div>
<div class="ship">🚀</div>

<div class="card">
    <div id="question" class="equation"></div>
    <div id="options"></div>
    <div id="feedback"></div>
</div>

<script>
    let lang = 'en', score = 0, lastResult = null;
    const problems = [
        { q: "\\log_2 8 = 3", options: ["2^3 = 8", "3^2 = 8", "8^2 = 3", "2^8 = 3"], a: "2^3 = 8", solEn: "\\log_2 8 = 3 \\implies 2^3 = 8", solZh: "\\log_2 8 = 3 \\implies 2^3 = 8" },
        { q: "5^2 = 25", options: ["\\log_5 2 = 25", "\\log_{25} 5 = 2", "\\log_5 25 = 2", "\\log_2 25 = 5"], a: "\\log_5 25 = 2", solEn: "5^2 = 25 \\implies \\log_5 25 = 2", solZh: "5^2 = 25 \\implies \\log_5 25 = 2" }
    ];

    function toggleLang() {
        lang = lang === 'en' ? 'zh' : 'en';
        if (lastResult) updateFeedback(lastResult.selected, lastResult.correct, lastResult.p, lastResult.btn);
    }

    function loadQuestion() {
        lastResult = null;
        const p = problems[Math.floor(Math.random() * problems.length)];
        katex.render(p.q, document.getElementById('question'));
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        document.getElementById('feedback').innerHTML = '';
        
        p.options.forEach(opt => {
            const btn = document.createElement('button');
            optDiv.appendChild(btn);
            katex.render(opt, btn);
            btn.onclick = () => checkAnswer(opt, p.a, p, btn);
        });
    }

    function updateFeedback(sel, corr, p, btn) {
        const fb = document.getElementById('feedback');
        const sol = p[lang === 'en' ? 'solEn' : 'solZh'];
        const stat = sel === corr ? (lang === 'en' ? "\\text{Correct! } " : "\\text{正确! } ") : (lang === 'en' ? "\\text{Incorrect. } " : "\\text{错误。 } ");
        katex.render(stat + sol, fb);
    }

    function checkAnswer(sel, corr, p, btn) {
        lastResult = { selected: sel, correct: corr, p: p, btn: btn };
        document.querySelectorAll('button').forEach(b => b.disabled = true);
        
        if(sel === corr) {
            btn.classList.add('selected-correct');
            score += 10;
            document.getElementById('score').innerText = score;
        } else {
            btn.classList.add('selected-wrong');
        }
        
        updateFeedback(sel, corr, p, btn);
        const next = document.createElement('button');
        next.className = "next-btn";
        next.innerText = lang === 'en' ? "Next Question" : "下一题";
        next.onclick = loadQuestion;
        document.getElementById('options').appendChild(next);
    }

    window.onload = loadQuestion;
</script>
</body>
</html>
