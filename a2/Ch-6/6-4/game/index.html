<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Logarithmic Galaxy</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
    ></script>
    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #05070a;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Segoe UI", sans-serif;
        color: white;
      }

      #starfield {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
      .star {
        fill: white;
        animation: twinkle 4s infinite ease-in-out;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 0.7;
        }
      }
      .ufo {
        position: absolute;
        top: 10%;
        left: -50px;
        font-size: 30px;
        animation: flyUfo 25s linear infinite;
      }
      .ship {
        position: absolute;
        bottom: 15%;
        right: -50px;
        font-size: 30px;
        animation: flyShip 15s linear infinite;
      }
      .planet {
        position: absolute;
        top: 20%;
        right: 10%;
        width: 50px;
        height: 50px;
        background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe);
        border-radius: 50%;
      }
      @keyframes flyUfo {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(110vw);
        }
      }
      @keyframes flyShip {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-110vw);
        }
      }

      #ui-top {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        align-items: center;
      }
      #score-board {
        font-size: 1.5em;
        color: #ffd700;
        font-weight: bold;
      }
      #lang-btn {
        cursor: pointer;
        background: #4a90e2;
        padding: 5px 10px;
        border-radius: 5px;
        border: none;
        color: white;
      }
      .card {
        background: rgba(30, 42, 62, 0.7);
        padding: 40px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
        width: 90%;
        max-width: 500px;
        margin-top: 20px;
      }
      .equation {
        font-size: 2em;
        margin: 20px 0;
        min-height: 50px;
        color: #ffd700;
      }
      button {
        display: block;
        width: 100%;
        margin: 12px 0;
        padding: 20px;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid #4a90e2;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.2em;
      }
      button:hover:not(:disabled) {
        background: #4a90e2;
      }

      /* Highlight styles */
      .selected-correct {
        background: #006400 !important;
        border-color: #00ff00 !important;
      }
      .selected-wrong {
        background: #8b0000 !important;
        border-color: #ff0000 !important;
      }
      .next-btn {
        background: #ffd700 !important;
        color: #000 !important;
        border-color: #e6b800 !important;
        font-weight: bold;
      }

      #feedback {
        font-size: 1.1em;
        margin-top: 15px;
        font-weight: bold;
        min-height: 50px;
      }
    </style>
  </head>
  <body>
    <div id="ui-top">
      <div id="score-board">Points: <span id="score">0</span></div>
      <button id="lang-btn" onclick="toggleLang()">中 / EN</button>
    </div>

    <svg id="starfield"></svg>
    <div class="ufo">🛸</div>
    <div class="planet"></div>
    <div class="ship">🚀</div>

    <div class="card">
      <div id="question" class="equation"></div>
      <div id="options"></div>
      <div id="feedback"></div>
    </div>

    <script>
      let lang = "en",
        score = 0,
        lastResult = null;
      const problems = [
        // Original problems
        {
          q: "2^5 = 32",
          options: [
            "\\log_2 32 = 5",
            "\\log_5 32 = 2",
            "\\log_2 5 = 32",
            "\\log_{32} 5 = 2",
          ],
          a: "\\log_2 32 = 5",
          solEn: "2^5 = 32 \\implies \\log_2 32 = 5",
          solZh: "2^5 = 32 \\implies \\log_2 32 = 5",
        },
        {
          q: "\\log_4 16 = 2",
          options: ["4^2 = 16", "2^4 = 16", "16^2 = 4", "4^{16} = 2"],
          a: "4^2 = 16",
          solEn: "\\log_4 16 = 2 \\implies 4^2 = 16",
          solZh: "\\log_4 16 = 2 \\implies 4^2 = 16",
        },
        {
          q: "10^4 = 10000",
          options: [
            "\\log_{10} 10000 = 4",
            "\\log_{10000} 10 = 4",
            "\\log_4 10000 = 10",
            "\\log_{10} 4 = 10000",
          ],
          a: "\\log_{10} 10000 = 4",
          solEn: "10^4 = 10000 \\implies \\log_{10} 10000 = 4",
          solZh: "10^4 = 10000 \\implies \\log_{10} 10000 = 4",
        },
        {
          q: "\\log_3 27 = 3",
          options: ["3^3 = 27", "3^2 = 27", "27^3 = 3", "3^{27} = 3"],
          a: "3^3 = 27",
          solEn: "\\log_3 27 = 3 \\implies 3^3 = 27",
          solZh: "\\log_3 27 = 3 \\implies 3^3 = 27",
        },
        {
          q: "5^3 = 125",
          options: [
            "\\log_5 125 = 3",
            "\\log_{125} 5 = 3",
            "\\log_3 125 = 5",
            "\\log_5 3 = 125",
          ],
          a: "\\log_5 125 = 3",
          solEn: "5^3 = 125 \\implies \\log_5 125 = 3",
          solZh: "5^3 = 125 \\implies \\log_5 125 = 3",
        },
        {
          q: "\\log_2 64 = 6",
          options: ["2^6 = 64", "6^2 = 64", "2^{64} = 6", "64^2 = 6"],
          a: "2^6 = 64",
          solEn: "\\log_2 64 = 6 \\implies 2^6 = 64",
          solZh: "\\log_2 64 = 6 \\implies 2^6 = 64",
        },
        {
          q: "8^2 = 64",
          options: [
            "\\log_8 64 = 2",
            "\\log_2 64 = 8",
            "\\log_{64} 8 = 2",
            "\\log_8 2 = 64",
          ],
          a: "\\log_8 64 = 2",
          solEn: "8^2 = 64 \\implies \\log_8 64 = 2",
          solZh: "8^2 = 64 \\implies \\log_8 64 = 2",
        },
        {
          q: "\\log_9 81 = 2",
          options: ["9^2 = 81", "2^9 = 81", "81^2 = 9", "9^{81} = 2"],
          a: "9^2 = 81",
          solEn: "\\log_9 81 = 2 \\implies 9^2 = 81",
          solZh: "\\log_9 81 = 2 \\implies 9^2 = 81",
        },
        {
          q: "2^7 = 128",
          options: [
            "\\log_2 128 = 7",
            "\\log_7 128 = 2",
            "\\log_2 7 = 128",
            "\\log_{128} 2 = 7",
          ],
          a: "\\log_2 128 = 7",
          solEn: "2^7 = 128 \\implies \\log_2 128 = 7",
          solZh: "2^7 = 128 \\implies \\log_2 128 = 7",
        },
        {
          q: "\\log_{10} 10 = 1",
          options: ["10^1 = 10", "1^10 = 10", "10^{10} = 1", "1^1 = 10"],
          a: "10^1 = 10",
          solEn: "\\log_{10} 10 = 1 \\implies 10^1 = 10",
          solZh: "\\log_{10} 10 = 1 \\implies 10^1 = 10",
        },
        // Additional problems
        {
          q: "7^2 = 49",
          options: [
            "\\log_7 49 = 2",
            "\\log_2 49 = 7",
            "\\log_{49} 7 = 2",
            "\\log_7 2 = 49",
          ],
          a: "\\log_7 49 = 2",
          solEn: "7^2 = 49 \\implies \\log_7 49 = 2",
          solZh: "7^2 = 49 \\implies \\log_7 49 = 2",
        },
        {
          q: "\\log_6 36 = 2",
          options: ["6^2 = 36", "2^6 = 36", "36^2 = 6", "6^{36} = 2"],
          a: "6^2 = 36",
          solEn: "\\log_6 36 = 2 \\implies 6^2 = 36",
          solZh: "\\log_6 36 = 2 \\implies 6^2 = 36",
        },
        {
          q: "3^4 = 81",
          options: [
            "\\log_3 81 = 4",
            "\\log_4 81 = 3",
            "\\log_{81} 3 = 4",
            "\\log_3 4 = 81",
          ],
          a: "\\log_3 81 = 4",
          solEn: "3^4 = 81 \\implies \\log_3 81 = 4",
          solZh: "3^4 = 81 \\implies \\log_3 81 = 4",
        },
        {
          q: "\\log_{10} 0.1 = -1",
          options: [
            "10^{-1} = 0.1",
            "10^1 = 0.1",
            "(-1)^{10} = 0.1",
            "0.1^{-1} = 10",
          ],
          a: "10^{-1} = 0.1",
          solEn: "\\log_{10} 0.1 = -1 \\implies 10^{-1} = 0.1",
          solZh: "\\log_{10} 0.1 = -1 \\implies 10^{-1} = 0.1",
        },
        {
          q: "2^{-3} = 0.125",
          options: [
            "\\log_2 0.125 = -3",
            "\\log_{0.125} 2 = -3",
            "\\log_{-3} 0.125 = 2",
            "\\log_2 -3 = 0.125",
          ],
          a: "\\log_2 0.125 = -3",
          solEn: "2^{-3} = 0.125 \\implies \\log_2 0.125 = -3",
          solZh: "2^{-3} = 0.125 \\implies \\log_2 0.125 = -3",
        },
        {
          q: "\\log_5 1 = 0",
          options: ["5^0 = 1", "0^5 = 1", "5^1 = 0", "1^5 = 0"],
          a: "5^0 = 1",
          solEn: "\\log_5 1 = 0 \\implies 5^0 = 1",
          solZh: "\\log_5 1 = 0 \\implies 5^0 = 1",
        },
        {
          q: "4^3 = 64",
          options: [
            "\\log_4 64 = 3",
            "\\log_3 64 = 4",
            "\\log_{64} 4 = 3",
            "\\log_4 3 = 64",
          ],
          a: "\\log_4 64 = 3",
          solEn: "4^3 = 64 \\implies \\log_4 64 = 3",
          solZh: "4^3 = 64 \\implies \\log_4 64 = 3",
        },
        {
          q: "\\log_2 16 = 4",
          options: ["2^4 = 16", "4^2 = 16", "16^2 = 4", "2^{16} = 4"],
          a: "2^4 = 16",
          solEn: "\\log_2 16 = 4 \\implies 2^4 = 16",
          solZh: "\\log_2 16 = 4 \\implies 2^4 = 16",
        },
        {
          q: "6^3 = 216",
          options: [
            "\\log_6 216 = 3",
            "\\log_3 216 = 6",
            "\\log_{216} 6 = 3",
            "\\log_6 3 = 216",
          ],
          a: "\\log_6 216 = 3",
          solEn: "6^3 = 216 \\implies \\log_6 216 = 3",
          solZh: "6^3 = 216 \\implies \\log_6 216 = 3",
        },
        {
          q: "\\log_{10} 1000 = 3",
          options: [
            "10^3 = 1000",
            "3^{10} = 1000",
            "1000^3 = 10",
            "10^{1000} = 3",
          ],
          a: "10^3 = 1000",
          solEn: "\\log_{10} 1000 = 3 \\implies 10^3 = 1000",
          solZh: "\\log_{10} 1000 = 3 \\implies 10^3 = 1000",
        },
      ];

      function shuffle(array) {
        return [...array].sort(() => Math.random() - 0.5);
      }

      function toggleLang() {
        lang = lang === "en" ? "zh" : "en";
        if (lastResult)
          updateFeedback(
            lastResult.selected,
            lastResult.correct,
            lastResult.p,
            lastResult.btn,
          );
      }

      function loadQuestion() {
        lastResult = null;
        const p = problems[Math.floor(Math.random() * problems.length)];
        katex.render(p.q, document.getElementById("question"));
        const optDiv = document.getElementById("options");
        optDiv.innerHTML = "";
        document.getElementById("feedback").innerHTML = "";

        // Shuffle options here
        shuffle(p.options).forEach((opt) => {
          const btn = document.createElement("button");
          optDiv.appendChild(btn);
          katex.render(opt, btn);
          btn.onclick = () => checkAnswer(opt, p.a, p, btn);
        });
      }

      function updateFeedback(sel, corr, p, btn) {
        const fb = document.getElementById("feedback");
        const sol = p[lang === "en" ? "solEn" : "solZh"];
        const stat =
          sel === corr
            ? lang === "en"
              ? "\\text{Correct! } "
              : "\\text{正确! } "
            : lang === "en"
              ? "\\text{Incorrect. } "
              : "\\text{错误。 } ";
        katex.render(stat + sol, fb);
      }

      function checkAnswer(sel, corr, p, btn) {
        lastResult = { selected: sel, correct: corr, p: p, btn: btn };
        document.querySelectorAll("button").forEach((b) => (b.disabled = true));

        if (sel === corr) {
          btn.classList.add("selected-correct");
          score += 10;
          document.getElementById("score").innerText = score;
        } else {
          btn.classList.add("selected-wrong");
        }

        updateFeedback(sel, corr, p, btn);
        const next = document.createElement("button");
        next.className = "next-btn";
        next.innerText = lang === "en" ? "Next Question" : "下一题";
        next.onclick = loadQuestion;
        document.getElementById("options").appendChild(next);
      }

      window.onload = loadQuestion;
    </script>
  </body>
</html>
