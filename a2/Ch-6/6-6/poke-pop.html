<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marill Population Growth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
        },
        svg: { fontCache: "global" },
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
    <style>
      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body class="bg-gray-900 min-h-screen flex flex-col items-center p-4">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-blue-400">Marill Population Growth</h1>
    </header>

    <div
      class="bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-2xl flex flex-col items-center"
    >
      <div id="content" class="flex flex-col items-center w-full">
        <div class="mb-6 text-center">
          <p
            id="info-text"
            class="text-2xl font-bold text-green-500 mb-2 min-h-[40px]"
          >
            Select a point
          </p>
        </div>

        <div class="relative w-full h-96">
          <canvas
            id="graphCanvas"
            class="w-full h-96 border-b-2 border-l-2 border-gray-600 bg-gray-900"
          ></canvas>
          <div
            class="absolute inset-0 flex items-center justify-center pointer-events-none"
          >
            <div
              class="text-2xl text-white font-mono bg-gray-900/60 px-4 py-2 rounded border border-gray-600"
            >
              $f(x) = 2^x$
            </div>
          </div>
        </div>

        <div
          id="population-count"
          class="flex flex-wrap justify-center gap-2 mt-4 min-h-[64px]"
        ></div>
      </div>
    </div>

    <script>
      var canvas = document.getElementById("graphCanvas");
      var ctx = canvas.getContext("2d");
      var infoText = document.getElementById("info-text");
      var popContainer = document.getElementById("population-count");
      var marillSpriteUrl =
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/183.png";
      var selectedPointIndex = -1;

      var points = [
        { x: 0, y: 1 },
        { x: 1, y: 2 },
        { x: 2, y: 4 },
        { x: 3, y: 8 },
        { x: 4, y: 16 },
      ];

      // Robust Fetch implementation with XMLHttpRequest fallback
      function initSprite() {
        var url = "https://pokeapi.co/api/v2/pokemon/marill";

        if (window.fetch) {
          fetch(url)
            .then(function (res) {
              return res.json();
            })
            .then(function (data) {
              marillSpriteUrl = data.sprites.front_default;
            })
            .catch(function () {
              fallbackXHR(url);
            });
        } else {
          fallbackXHR(url);
        }
      }

      function fallbackXHR(url) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            marillSpriteUrl = data.sprites.front_default;
          }
        };
        xhr.send();
      }

      function drawGraph() {
        var w = (canvas.width = canvas.offsetWidth);
        var h = (canvas.height = canvas.offsetHeight);
        var padding = 60;
        ctx.clearRect(0, 0, w, h);

        ctx.fillStyle = "#9ca3af";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("Population", 10, 30);
        ctx.fillText("Generations", w - 140, h - 10);

        ctx.beginPath();
        ctx.strokeStyle = "#60a5fa";
        ctx.lineWidth = 4;
        for (var x = 0; x <= 4.1; x += 0.05) {
          var px = padding + (x / 4) * (w - padding * 2);
          var py = h - padding - (Math.pow(2, x) / 16) * (h - padding * 2);
          x === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();

        points.forEach(function (p, index) {
          var px = padding + (p.x / 4) * (w - padding * 2);
          var py = h - padding - (p.y / 16) * (h - padding * 2);
          ctx.fillStyle = index === selectedPointIndex ? "#22c55e" : "#f87171";
          ctx.beginPath();
          ctx.arc(px, py, 10, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      canvas.addEventListener("click", function (e) {
        var rect = canvas.getBoundingClientRect();
        var mouseX = e.clientX - rect.left;
        var mouseY = e.clientY - rect.top;
        var padding = 60;

        points.forEach(function (p, index) {
          var px = padding + (p.x / 4) * (canvas.width - padding * 2);
          var py =
            canvas.height -
            padding -
            (p.y / 16) * (canvas.height - padding * 2);
          if (Math.hypot(mouseX - px, mouseY - py) < 20) {
            selectedPointIndex = index;
            infoText.innerHTML =
              "$f(" + p.x + ") = 2^{" + p.x + "} = " + p.y + "$ Marills";
            MathJax.typesetPromise([infoText]);
            renderMarills(p.y);
            drawGraph();
          }
        });
      });

      function renderMarills(count) {
        popContainer.innerHTML = "";

        // Reset container styles
        popContainer.style.maxWidth = "450px"; // 8 icons * (~48px width + 8px gap)
        popContainer.className =
          "flex flex-wrap justify-center gap-2 mt-4 min-h-[64px] mx-auto";

        for (var i = 0; i < count; i++) {
          var img = document.createElement("img");
          img.src = marillSpriteUrl;
          img.className = "w-12 h-12";
          popContainer.appendChild(img);
        }
      }

      window.addEventListener("resize", drawGraph);
      initSprite();
      drawGraph();
    </script>
  </body>
</html>
