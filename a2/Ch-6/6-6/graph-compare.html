<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exponential vs Logarithmic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background-color: #111827; }
      /* Added -webkit-user-select for Safari compatibility */
      canvas { 
        background-color: #030712; 
        border-radius: 20px; 
        cursor: crosshair; 
        -webkit-user-select: none;
        user-select: none; 
      }
      
      .legend-container { position: absolute; top: 30px; right: 30px; width: 300px; }
      .legend { background: #1f2937; padding: 20px 25px; border-radius: 12px; color: #fff; border: 1px solid #374151; }
      .legend-item { display: flex; align-items: center; margin: 12px 0; font-size: 20px; font-weight: bold; }
      .swatch { width: 40px; height: 6px; margin-right: 20px; border-radius: 2px; }
      .pos-sub { position: relative; top: 0.3em; font-size: 0.6em; margin-left: 1px; }
      .pos-sup { position: relative; top: -0.4em; font-size: 0.6em; }
      
      #calcBox { background: #1f2937; padding: 20px; border-radius: 12px; color: #e5e7eb; border: 1px solid #374151; margin-top: 15px; opacity: 0; transition: opacity 0.3s; }
      .math-text { font-family: 'Courier New', monospace; font-size: 1.5rem; margin: 12px 0; font-weight: bold; }
    </style>
  </head>
  <body class="flex justify-center items-center h-screen m-0">
    <div id="container" class="relative">
      <canvas id="graphCanvas" width="1000" height="600"></canvas>
      
      <div class="legend-container">
        <div class="legend">
          <div class="legend-item"><div class="swatch" style="background-color: #60a5fa"></div>y = 2<span class="pos-sup">x</span></div>
          <div class="legend-item"><div class="swatch" style="background-color: #fb7185"></div>y = log<span class="pos-sub">2</span>(x)</div>
        </div>
        
        <div id="calcBox">
          <div id="mathContent"></div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("graphCanvas");
      const ctx = canvas.getContext("2d");
      const calcBox = document.getElementById("calcBox");
      const mathContent = document.getElementById("mathContent");
      
      const gridSpacing = 60; 
      const centerX = 200;
      const centerY = 520;
      
      const points = [
        { x: 0, y: 1 }, { x: 1, y: 2 }, { x: 2, y: 4 }, 
        { x: 3, y: 8 }, { x: 4, y: 16 }
      ];
      let activePoint = null;

      function toPx(val) { return (val / 2) * gridSpacing; }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid
        ctx.strokeStyle = "#1f2937";
        for (let i = 0; i <= 20; i++) { ctx.beginPath(); ctx.moveTo(centerX + i * gridSpacing, 0); ctx.lineTo(centerX + i * gridSpacing, canvas.height); ctx.stroke(); }
        for (let i = 0; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(0, centerY - i * gridSpacing); ctx.lineTo(canvas.width, centerY - i * gridSpacing); ctx.stroke(); }

        // Axes and Labels
        ctx.strokeStyle = "#9ca3af"; ctx.fillStyle = "#9ca3af";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
        ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
        ctx.stroke();

        ctx.font = "14px Arial";
        ctx.textAlign = "center";
        for (let i = 0; i <= 16; i++) { ctx.fillText(i * 2, centerX + i * gridSpacing, centerY + 20); }
        ctx.textAlign = "right";
        for (let i = 0; i <= 10; i++) { ctx.fillText(i * 2, centerX - 10, centerY - i * gridSpacing + 5); }

        // Reflection Line y=x
        ctx.strokeStyle = "#4b5563";
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + toPx(16), centerY - toPx(16));
        ctx.stroke();
        ctx.setLineDash([]);

        // Curves
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#60a5fa";
        ctx.beginPath();
        for (let x = -2; x <= 4; x += 0.05) ctx.lineTo(centerX + toPx(x), centerY - toPx(Math.pow(2, x)));
        ctx.stroke();

        ctx.strokeStyle = "#fb7185";
        ctx.beginPath();
        for (let x = 0.05; x <= 16; x += 0.05) ctx.lineTo(centerX + toPx(x), centerY - toPx(Math.log2(x)));
        ctx.stroke();

        // Points
        points.forEach((p) => {
          ctx.fillStyle = "#60a5fa";
          ctx.beginPath(); ctx.arc(centerX + toPx(p.x), centerY - toPx(p.y), 8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fb7185";
          ctx.beginPath(); ctx.arc(centerX + toPx(p.y), centerY - toPx(p.x), 8, 0, Math.PI * 2); ctx.fill();

          if (activePoint === p) {
            ctx.fillStyle = "#fff";
            ctx.font = "bold 22px Arial";
            ctx.textAlign = "right";
            ctx.fillText(`(${p.x}, ${p.y})`, centerX + toPx(p.x) - 12, centerY - toPx(p.y) + 6);
            ctx.textAlign = "left";
            ctx.fillText(`(${p.y}, ${p.x})`, centerX + toPx(p.y) + 12, centerY - toPx(p.x) + 6);
          }
        });
      }

      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        activePoint = null;
        points.forEach((p) => {
          if (Math.hypot(centerX + toPx(p.x) - mx, centerY - toPx(p.y) - my) < 20 ||
              Math.hypot(centerX + toPx(p.y) - mx, centerY - toPx(p.x) - my) < 20) {
            activePoint = p;
          }
        });

        if (activePoint) {
          calcBox.style.opacity = "1";
          mathContent.innerHTML = `
            <div class="math-text" style="color: #60a5fa">2<sup>${activePoint.x}</sup> = ${activePoint.y}</div>
            <div class="math-text" style="color: #fb7185">log<sub>2</sub>(${activePoint.y}) = ${activePoint.x}</div>
          `;
        } else {
          calcBox.style.opacity = "0";
        }
        draw();
      });

      draw();
    </script>
  </body>
</html>
