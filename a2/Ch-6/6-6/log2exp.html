<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logarithm to Exponent Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen p-4">

    <div class="bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-2xl text-center border border-gray-800">
        <h1 id="task-header" class="text-2xl font-bold text-gray-400 mb-8">Convert to exponential form</h1>
        
        <div id="question-area" class="my-8 text-center">
            <div class="text-5xl font-bold text-blue-400 mb-6">
                <span id="log-expression">log₂(8) = 3</span>
            </div>
            <div id="solution-text" class="text-5xl font-bold text-green-400 opacity-0 transition-opacity duration-300">
                <span id="exp-result">2³ = 8</span>
            </div>
        </div>

        <div class="mt-8 flex flex-col gap-3">
            <button onclick="showSolution()" id="solve-btn" class="w-full px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold transition-colors">Show Solution</button>
            <button onclick="nextQuestion()" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold transition-colors">Next Question</button>
        </div>
    </div>

    <script>
        const problems = [
            { log: "log₂(8) = 3", exp: "2³ = 8", type: "exponential" },
            { log: "log₃(9) = 2", exp: "3² = 9", type: "exponential" },
            { log: "log₅(125) = 3", exp: "5³ = 125", type: "logarithmic" }
        ];

        let currentIndex = 0;

        function updateHeader(type) {
            const header = document.getElementById('task-header');
            header.innerText = type === 'exponential' ? 'Convert to exponential form' : 'Convert to logarithmic form';
        }

        function showSolution() {
            const sol = document.getElementById('solution-text');
            sol.classList.remove('opacity-0');
            document.getElementById('solve-btn').disabled = true;
            document.getElementById('solve-btn').classList.add('opacity-50', 'cursor-not-allowed');
        }

        function nextQuestion() {
            const sol = document.getElementById('solution-text');
            
            // 1. Hide the solution immediately
            sol.classList.add('opacity-0');
            
            // 2. Use a small timeout to ensure the fade-out completes before swapping
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % problems.length;
                const p = problems[currentIndex];
                
                // If type is logarithmic, we show the exponential form as the prompt and log form as answer
                // Adjusting the swap logic for the display:
                document.getElementById('log-expression').innerText = p.type === 'exponential' ? p.log : p.exp;
                document.getElementById('exp-result').innerText = p.type === 'exponential' ? p.exp : p.log;
                
                updateHeader(p.type);
                
                document.getElementById('solve-btn').disabled = false;
                document.getElementById('solve-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            }, 300);
        }
    </script>
</body>
</html>
