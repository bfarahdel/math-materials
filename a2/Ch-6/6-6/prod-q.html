<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6 text-slate-100">

    <main id="quiz-container" class="bg-slate-900 p-12 rounded-xl shadow-xl border border-slate-700 w-full max-w-2xl">
        
        <div id="question-box">
            <p id="question-text" class="text-4xl font-semibold mb-10 leading-snug">Which is the correct expansion for $\log_3 (9 \times 27)$?</p>
            
            <div id="options" class="space-y-4">
                <button onclick="checkExpansion(false)" class="option-btn w-full p-6 text-2xl text-left border border-slate-700 rounded-lg hover:bg-slate-800 transition flex items-center">
                    <span class="font-bold mr-4 text-slate-400">A.</span>
                    <span>$\log_3 9 \times \log_3 27$</span>
                </button>
                <button onclick="checkExpansion(true)" class="option-btn w-full p-6 text-2xl text-left border border-slate-700 rounded-lg hover:bg-slate-800 transition flex items-center">
                    <span class="font-bold mr-4 text-slate-400">B.</span>
                    <span>$\log_3 9 + \log_3 27$</span>
                </button>
                <button onclick="checkExpansion(false)" class="option-btn w-full p-6 text-2xl text-left border border-slate-700 rounded-lg hover:bg-slate-800 transition flex items-center">
                    <span class="font-bold mr-4 text-slate-400">C.</span>
                    <span>$\log_3 9 - \log_3 27$</span>
                </button>
            </div>
        </div>

        <div id="feedback" class="hidden p-6 rounded-lg font-medium text-lg text-center mt-8 border"></div>
        
        <div class="flex gap-4 mt-8">
            <button id="reset-btn" onclick="resetQuiz()" class="hidden flex-1 bg-slate-800 text-slate-200 border border-slate-700 py-4 text-xl font-semibold rounded-lg hover:bg-slate-700 transition">Try Again</button>
            <button id="next-btn" onclick="showEvaluation()" class="hidden flex-1 bg-blue-600 text-white py-4 text-xl font-semibold rounded-lg hover:bg-blue-500 transition">Next: Evaluate Expression</button>
        </div>
    </main>

    <script>
        const initialOptionsHTML = document.getElementById('options').innerHTML;
        let currentStage = 1;

        function checkExpansion(isCorrect) {
            currentStage = 1;
            const feedback = document.getElementById('feedback');
            const options = document.getElementById('options');
            const nextBtn = document.getElementById('next-btn');
            const resetBtn = document.getElementById('reset-btn');
            
            options.classList.add('pointer-events-none', 'opacity-50');
            feedback.classList.remove('hidden');

            if (isCorrect) {
                feedback.innerHTML = "Correct! The product rule states $\\log_b(xy) = \\log_b x + \\log_b y$.";
                feedback.className = "p-6 rounded-lg font-medium text-lg text-center mt-8 border bg-emerald-950 text-emerald-300 border-emerald-800";
                nextBtn.classList.remove('hidden');
                resetBtn.classList.add('hidden');
            } else {
                feedback.innerHTML = "Not quite. Recall the product rule: $\\log_b(xy) = \\log_b x + \\log_b y$. Try again.";
                feedback.className = "p-6 rounded-lg font-medium text-lg text-center mt-8 border bg-rose-950 text-rose-300 border-rose-800";
                resetBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
            }
            MathJax.typeset();
        }

        function showEvaluation() {
            currentStage = 2;
            document.getElementById('question-text').innerHTML = "Now, evaluate $\\log_3 9 + \\log_3 27$:";
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
            
            const options = document.getElementById('options');
            options.classList.remove('pointer-events-none', 'opacity-50');
            options.innerHTML = `
                <button onclick="finish(false)" class="w-full p-6 text-2xl text-left border border-slate-700 rounded-lg hover:bg-slate-800 transition flex items-center">
                    <span class="font-bold mr-4 text-slate-400">A.</span>
                    <span>3</span>
                </button>
                <button onclick="finish(true)" class="w-full p-6 text-2xl text-left border border-slate-700 rounded-lg hover:bg-slate-800 transition flex items-center">
                    <span class="font-bold mr-4 text-slate-400">B.</span>
                    <span>5</span>
                </button>
                <button onclick="finish(false)" class="w-full p-6 text-2xl text-left border border-slate-700 rounded-lg hover:bg-slate-800 transition flex items-center">
                    <span class="font-bold mr-4 text-slate-400">C.</span>
                    <span>6</span>
                </button>
            `;
            MathJax.typeset();
        }

        function finish(isCorrect) {
            const feedback = document.getElementById('feedback');
            const options = document.getElementById('options');
            const resetBtn = document.getElementById('reset-btn');
            
            options.classList.add('pointer-events-none', 'opacity-50');
            feedback.classList.remove('hidden');
            resetBtn.classList.remove('hidden');
            
            if (isCorrect) {
                feedback.innerHTML = "Correct! $2 + 3 = 5$.";
                feedback.className = "p-6 rounded-lg font-medium text-lg text-center mt-8 border bg-emerald-950 text-emerald-300 border-emerald-800";
            } else {
                feedback.innerHTML = "Incorrect. Remember $\\log_3 9 = 2$ and $\\log_3 27 = 3$.";
                feedback.className = "p-6 rounded-lg font-medium text-lg text-center mt-8 border bg-rose-950 text-rose-300 border-rose-800";
            }
            MathJax.typeset();
        }

        function resetQuiz() {
            const options = document.getElementById('options');
            const feedback = document.getElementById('feedback');
            const resetBtn = document.getElementById('reset-btn');
            const nextBtn = document.getElementById('next-btn');

            feedback.classList.add('hidden');
            resetBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            options.classList.remove('pointer-events-none', 'opacity-50');

            if (currentStage === 1) {
                options.innerHTML = initialOptionsHTML;
            } else {
                document.getElementById('question-text').innerHTML = "Which is the correct expansion for $\\log_3 (9 \\times 27)$?";
                options.innerHTML = initialOptionsHTML;
                currentStage = 1;
            }
            MathJax.typeset();
        }
    </script>
</body>
</html>
