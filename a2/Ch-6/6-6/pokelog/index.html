<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokelog</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        background: radial-gradient(circle, #003300 0%, #000000 100%);
        color: #e0e0e0;
        text-align: center;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
      }
      #arena {
        position: relative;
        height: 350px;
        max-width: 600px;
        margin: 0 auto;
        background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
      }
      .name-tag {
        background: white;
        color: black;
        padding: 2px 8px;
        border-radius: 5px;
        font-weight: bold;
        text-transform: capitalize;
        border: 2px solid #560303;
        display: inline-block;
        font-size: 0.9em;
        margin-bottom: 5px;
      }
      #question-area {
        background-color: #000000;
        padding: 40px;
        border-radius: 15px;
        width: 80%;
        margin: 20px auto;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }
      #feedback {
        font-size: 2em;
        padding: 20px 0;
        font-weight: bold;
      }
      #options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        width: 90%;
        margin: 0 auto;
      }
      .option-btn {
        width: 100%;
        padding: 15px 20px;
        font-size: 1.5em;
        cursor: pointer;
        border: 3px solid #560303;
        background-color: rgba(0, 0, 0, 0.4);
        color: #e0e0e0;
        border-radius: 10px;
        transition: background-color 0.3s;
        display: flex;
        align-items: center;
        text-align: left;
      }
      .option-label {
        font-weight: bold;
        margin-right: 15px;
        min-width: 30px;
        display: inline-block;
        color: #9e9e9e;
      }
      .option-btn:hover:not(:disabled) {
        background-color: rgba(86, 3, 3, 0.3);
      }
      #next-btn {
        display: none;
        margin-top: 20px;
        background-color: #001a15 !important;
      }

      #sprite-wrapper,
      #opp-container {
        transition: transform 0.4s ease-out;
        z-index: 5;
      }

      @keyframes jiggle {
        0%,
        100% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(-15px, 0);
        }
        50% {
          transform: translate(15px, 0);
        }
        75% {
          transform: translate(-15px, 0);
        }
      }
      .jiggle-effect {
        animation: jiggle 0.1s linear 6;
      }
    </style>
  </head>
  <body>
    <div id="arena">
      <div
        id="opp-container"
        style="position: absolute; top: 20px; right: 50px; z-index: 2"
      >
        <div id="opp-name" class="name-tag">???</div>
        <br />
        <canvas
          id="opp-canvas"
          width="180"
          height="180"
          title="Opponent Pokemon"
        ></canvas>
      </div>

      <div
        id="user-container"
        style="position: absolute; bottom: 40px; left: 50px; z-index: 3"
      >
        <div id="sprite-wrapper">
          <img
            id="user-sprite"
            src=""
            width="180"
            height="180"
            alt="Player's Pokemon"
          />
        </div>
        <div style="text-align: left; margin-top: 5px">
          <div id="user-name" class="name-tag"></div>
          <div style="width: 150px; height: 15px; background-color: #121212">
            <div
              id="user-hp"
              style="
                height: 100%;
                background: #1b5e20;
                width: 100%;
                transition: width 0.5s;
              "
            ></div>
          </div>
        </div>
      </div>
    </div>

    <div id="question-area">
      <h2 id="q-text">Loading...</h2>
      <div id="options"></div>
      <div id="feedback"></div>
      <button id="next-btn" class="btn btn-large" onclick="nextQuestion()">
        Next Question
      </button>
    </div>

    <script>
      let userHp = 100,
        qIndex = 0;
      const playerPokemon = "marill";
      const horde = [25, 1, 4, 7, 10, 16, 19, 23, 52, 92];
      const questionBank = [
        // --- Evaluate Questions (Numerical results only) ---
        {
          type: "Evaluate",
          q: "\\(\\log_{10}(1000)\\)",
          opts: ["1", "2", "3", "30"],
          correct: 2,
        },
        {
          type: "Evaluate",
          q: "\\(\\log_{2}(8)\\)",
          opts: ["2", "3", "4", "8"],
          correct: 1,
        },
        {
          type: "Evaluate",
          q: "\\(\\log_{5}(25)\\)",
          opts: ["2", "5", "10", "25"],
          correct: 0,
        },
        {
          type: "Evaluate",
          q: "\\(\\log_{3}(81)\\)",
          opts: ["3", "4", "9", "27"],
          correct: 1,
        },
        {
          type: "Evaluate",
          q: "\\(\\log_{7}(49)\\)",
          opts: ["1", "2", "7", "14"],
          correct: 1,
        },

        // --- Expand Questions (Property application only) ---
        {
          type: "Expand",
          q: "\\(\\log(10 \\cdot 100)\\)",
          opts: [
            "\\(\\log(10) \\cdot \\log(100)\\)",
            "\\(\\log(10) + \\log(100)\\)",
            "\\(\\log(10) - \\log(100)\\)",
            "\\(\\log(10) / \\log(100)\\)",
          ],
          correct: 1,
        },
        {
          type: "Expand",
          q: "\\(\\log\\left(\\frac{1000}{10}\\right)\\)",
          opts: [
            "\\(\\log(1000) \\cdot \\log(10)\\)",
            "\\(\\log(1000) + \\log(10)\\)",
            "\\(\\log(1000) - \\log(10)\\)",
            "\\(\\frac{\\log(1000)}{\\log(10)}\\)",
          ],
          correct: 2,
        },
        {
          type: "Expand",
          q: "\\(\\log(10^5)\\)",
          opts: [
            "\\(5 \\log(10)\\)",
            "\\(\\log(5) + \\log(10)\\)",
            "\\(10 \\log(5)\\)",
            "\\(\\log(5) \\cdot \\log(10)\\)",
          ],
          correct: 0,
        },
        {
          type: "Expand",
          q: "\\(\\log\\left(\\frac{100}{10^2}\\right)\\)",
          opts: [
            "\\(\\log(100) + 2\\log(10)\\)",
            "\\(\\log(100) - 2\\log(10)\\)",
            "\\(2\\log(100) - \\log(10)\\)",
            "\\(\\log(100) / \\log(2)\\)",
          ],
          correct: 1,
        },
      ];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }
      async function getPokemonData(id) {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        return await res.json();
      }

      async function updateOpponent() {
        const canvas = document.getElementById("opp-canvas"),
          ctx = canvas.getContext("2d");
        const data = await getPokemonData(
          horde[Math.floor(Math.random() * horde.length)],
        );
        document.getElementById("opp-name").innerText = data.name;
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = data.sprites.front_default;
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 20, 20, 140, 140);
          ctx.globalCompositeOperation = "multiply";
          ctx.beginPath();
          for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const dist = 50 + Math.random() * 40;
            const x = 90 + Math.cos(angle) * dist,
              y = 90 + Math.sin(angle) * dist;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fillStyle = "rgba(100, 180, 100, 0.8)";
          ctx.fill();
          ctx.globalCompositeOperation = "source-over";
        };
      }

      function nextQuestion() {
        if (qIndex >= questionBank.length) {
          shuffle(questionBank);
          qIndex = 0;
        }
        const currentQ = questionBank[qIndex++];
        document.getElementById("feedback").innerText = "";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("q-text").innerHTML =
          `${currentQ.type}: ${currentQ.q}`;
        const optDiv = document.getElementById("options");
        optDiv.innerHTML = "";
        currentQ.opts.forEach((o, i) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerHTML = `<span class="option-label">${["A", "B", "C", "D"][i]}</span><span>${o}</span>`;
          btn.onclick = () =>
            checkAnswer(
              i === currentQ.correct,
              currentQ.opts[currentQ.correct],
            );
          optDiv.appendChild(btn);
        });
        if (window.MathJax) MathJax.typesetPromise();
      }

      function checkAnswer(isCorrect, correctText) {
        document
          .querySelectorAll(".option-btn")
          .forEach((b) => (b.disabled = true));
        const spriteWrapper = document.getElementById("sprite-wrapper");
        const oppContainer = document.getElementById("opp-container");
        const userContainer = document.getElementById("user-container");
        const feedback = document.getElementById("feedback");

        if (isCorrect) {
          const userRect = spriteWrapper.getBoundingClientRect();
          const oppRect = oppContainer.getBoundingClientRect();
          spriteWrapper.style.transform = `translate(${oppRect.left - userRect.left}px, ${oppRect.top - userRect.top}px)`;
          setTimeout(() => {
            oppContainer.classList.add("jiggle-effect");
            spriteWrapper.style.transform = `translate(0, 0)`;
            setTimeout(() => {
              oppContainer.classList.remove("jiggle-effect");
              updateOpponent();
            }, 600);
          }, 400);
          feedback.style.color = "#a5d6a7";
          feedback.innerHTML = "Correct!";
          document.getElementById("next-btn").style.display = "inline-block";
        } else {
          // Opponent Counter-Attack
          const oppRect = oppContainer.getBoundingClientRect();
          const userRect = userContainer.getBoundingClientRect();
          oppContainer.style.transform = `translate(${userRect.left - oppRect.left}px, ${userRect.top - oppRect.top}px)`;
          setTimeout(() => {
            userContainer.classList.add("jiggle-effect");
            oppContainer.style.transform = `translate(0, 0)`;
            setTimeout(
              () => userContainer.classList.remove("jiggle-effect"),
              600,
            );
          }, 400);

          feedback.style.color = "#ef9a9a";
          feedback.innerHTML = "Incorrect! " + correctText;
          userHp = Math.max(0, userHp - 20);
          document.getElementById("user-hp").style.width = userHp + "%";
          if (userHp <= 0) triggerGameOver();
          else
            document.getElementById("next-btn").style.display = "inline-block";
        }
        if (window.MathJax) MathJax.typesetPromise();
      }

      function triggerGameOver() {
        const feedback = document.getElementById("feedback");
        feedback.innerHTML =
          "GAME OVER!<br><button class='btn' onclick='location.reload()'>Restart Game</button>";
        document.getElementById("next-btn").style.display = "none";
      }

      async function init() {
        shuffle(questionBank);
        const userData = await getPokemonData(playerPokemon);
        document.getElementById("user-sprite").src =
          userData.sprites.front_default;
        document.getElementById("user-name").innerText = userData.name;
        await updateOpponent();
        nextQuestion();
      }
      init();
    </script>
  </body>
</html>
