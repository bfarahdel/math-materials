<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokelog</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        background: radial-gradient(circle, #003300 0%, #000000 100%);
        color: #e0e0e0;
        text-align: center;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }
      #arena {
        position: relative;
        height: 350px;
        max-width: 600px;
        margin: 0 auto;
        background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
      }
      .name-tag {
        background: white;
        color: black;
        padding: 2px 8px;
        border-radius: 5px;
        font-weight: bold;
        text-transform: capitalize;
        border: 2px solid #560303;
        display: inline-block;
        font-size: 0.9em;
        margin-bottom: 5px;
      }
      .boss-tag {
        background: #560303 !important;
        color: #ff3333 !important;
        border: 2px solid #ff3333 !important;
        box-shadow: 0 0 10px #ff0000;
      }
      #question-area {
        background-color: #000000;
        padding: 40px;
        border-radius: 15px;
        width: 80%;
        margin: 20px auto;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }
      #feedback {
        font-size: 2em;
        padding: 20px 0;
        font-weight: bold;
      }
      #options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        width: 90%;
        margin: 0 auto;
      }
      .option-btn {
        width: 100%;
        padding: 15px 20px;
        font-size: 1.5em;
        cursor: pointer;
        border: 3px solid #560303;
        background-color: rgba(0, 0, 0, 0.4);
        color: #e0e0e0;
        border-radius: 10px;
        transition: background-color 0.3s;
        display: flex;
        align-items: center;
        text-align: left;
      }
      .option-label {
        font-weight: bold;
        margin-right: 15px;
        min-width: 30px;
        display: inline-block;
        color: #9e9e9e;
      }
      .option-btn:hover:not(:disabled) {
        background-color: rgba(86, 3, 3, 0.3);
      }
      #next-btn {
        display: none;
        margin-top: 20px;
        background-color: #001a15 !important;
      }
      #sprite-wrapper,
      #opp-container {
        transition: transform 0.4s ease-out;
        z-index: 5;
      }
      #opp-canvas {
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .boss-sprite {
        transform: scale(1.5);
        transform-origin: center bottom;
      }
      @keyframes jiggle {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-15px, 0); }
        50% { transform: translate(15px, 0); }
        75% { transform: translate(-15px, 0); }
      }
      .jiggle-effect {
        animation: jiggle 0.1s linear 6;
      }
      #boss-splash {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
      #boss-splash.active {
        opacity: 1;
        pointer-events: auto;
      }
      .boss-title {
        font-family: 'Impact', 'Arial Black', sans-serif;
        font-size: 3.5rem;
        color: #ff1111;
        text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        letter-spacing: 4px;
        margin: 0;
        text-transform: uppercase;
        animation: pulse 1s infinite alternate;
      }
      .boss-subtitle {
        font-size: 1.2rem;
        color: #ffffff;
        margin-top: 10px;
      }
      @keyframes pulse {
        from { transform: scale(0.95); text-shadow: 0 0 10px #ff0000; }
        to { transform: scale(1.05); text-shadow: 0 0 25px #ff0000, 0 0 40px #ff0000; }
      }

      /* Celebration Jumping Layout Styles */
      .party-pokemon {
        position: fixed;
        width: 120px;
        height: 120px;
        z-index: 1;
        animation: jump 0.6s infinite alternate cubic-bezier(0.25, 1, 0.5, 1);
      }
      @keyframes jump {
        from { transform: translateY(0); }
        to { transform: translateY(-35px); }
      }
    </style>
  </head>
  <body>
    <div id="arena">
      <div id="boss-splash">
        <h1 class="boss-title">Boss Fight</h1>
        <div id="boss-splash-text" class="boss-subtitle">A wild ??? appeared!</div>
      </div>

      <div id="opp-container" style="position: absolute; top: 20px; right: 50px; z-index: 2">
        <canvas id="opp-canvas" width="180" height="180" title="Opponent Pokemon"></canvas>
        <br />
        <div id="opp-name" class="name-tag">???</div>
      </div>

      <div id="user-container" style="position: absolute; bottom: 40px; left: 50px; z-index: 3">
        <div id="sprite-wrapper">
          <img id="user-sprite" src="" width="180" height="180" alt="Player's Pokemon" />
        </div>
        <div style="text-align: left; margin-top: 5px">
          <div id="user-name" class="name-tag"></div>
          <div style="width: 150px; height: 15px; background-color: #121212">
            <div id="user-hp" style="height: 100%; background: #1b5e20; width: 100%; transition: width 0.5s;"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="question-area">
      <h2 id="q-text">Loading...</h2>
      <div id="options"></div>
      <div id="feedback"></div>
      <button id="next-btn" class="btn btn-large" onclick="nextQuestion()">Next Question</button>
    </div>

    <script>
      let userHp = 100, qIndex = 0;
      let regularStreak = 0; 
      let bossHits = 0;
      let isBossMode = false;
      let currentBossName = "";

      const playerPokemon = "marill";
      const horde = [25, 1, 4, 7, 10, 16, 19, 23, 52, 92];
      const bosses = [149, 150, 248, 384, 487]; 
      
      const questionBank = [
        { type: "Evaluate", q: "\\(\\log_{10}(1000)\\)", opts: ["1", "2", "3", "30"], correct: 2 },
        { type: "Evaluate", q: "\\(\\log_{2}(8)\\)", opts: ["2", "3", "4", "8"], correct: 1 },
        { type: "Evaluate", q: "\\(\\log_{5}(25)\\)", opts: ["2", "5", "10", "25"], correct: 0 },
        { type: "Evaluate", q: "\\(\\log_{3}(81)\\)", opts: ["3", "4", "9", "27"], correct: 1 },
        { type: "Evaluate", q: "\\(\\log_{7}(49)\\)", opts: ["1", "2", "7", "14"], correct: 1 },
        { type: "Expand", q: "\\(\\log(10 \\cdot 100)\\)", opts: ["\\(\\log(10) \\cdot \\log(100)\\)", "\\(\\log(10) + \\log(100)\\)", "\\(\\log(10) - \\log(100)\\)", "\\(\\log(10) / \\log(100)\\)"], correct: 1 },
        { type: "Expand", q: "\\(\\log\\left(\\frac{1000}{10}\\right)\\)", opts: ["\\(\\log(1000) \\cdot \\log(10)\\)", "\\(\\log(1000) + \\log(10)\\)", "\\(\\log(1000) - \\log(10)\\)", "\\(\\frac{\\log(1000)}{\\log(10)}\\)"], correct: 2 },
        { type: "Expand", q: "\\(\\log(10^5)\\)", opts: ["\\(5 \\log(10)\\)", "\\(\\log(5) + \\log(10)\\)", "\\(10 \\log(5)\\)", "\\(\\log(5) \\cdot \\log(10)\\)"], correct: 0 },
        { type: "Expand", q: "\\(\\log\\left(\\frac{100}{10^2}\\right)\\)", opts: ["\\(\\log(100) + 2\\log(10)\\)", "\\(\\log(100) - 2\\log(10)\\)", "\\(2\\log(100) - \\log(10)\\)", "\\(\\log(100) / \\log(2)\\)"], correct: 1 }
      ];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function fetchResource(url) {
        return new Promise((resolve, reject) => {
          if (window.fetch) {
            fetch(url)
              .then(res => { if (!res.ok) throw new Error("Network error"); return res.json(); })
              .then(resolve)
              .catch(err => { console.warn("Fetch failed, using XHR", err); fallbackXHR(url, resolve, reject); });
          } else {
            fallbackXHR(url, resolve, reject);
          }
        });
      }

      function fallbackXHR(url, resolve, reject) {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
            else reject(new Error("XHR Failed"));
          }
        };
        xhr.send();
      }

      async function getPokemonData(id) {
        return await fetchResource(`https://pokeapi.co/api/v2/pokemon/${id}`);
      }

      async function updateOpponent() {
        const canvas = document.getElementById("opp-canvas"), ctx = canvas.getContext("2d");
        const oppNameTag = document.getElementById("opp-name");
        
        try {
          let pokemonId;
          if (isBossMode) {
            pokemonId = bosses[Math.floor(Math.random() * bosses.length)];
            canvas.classList.add("boss-sprite");
            oppNameTag.classList.add("boss-tag");
          } else {
            pokemonId = horde[Math.floor(Math.random() * horde.length)];
            canvas.classList.remove("boss-sprite");
            oppNameTag.classList.remove("boss-tag");
          }

          const data = await getPokemonData(pokemonId);
          currentBossName = data.name;
          oppNameTag.innerText = isBossMode ? `BOSS ${data.name}` : data.name;
          oppNameTag.style.visibility = "visible";
          
          const img = new Image();
          img.crossOrigin = "Anonymous";
          img.src = data.sprites.front_default;
          img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 20, 20, 140, 140);
            ctx.globalCompositeOperation = "multiply";
            ctx.beginPath();
            
            let count = isBossMode ? 16 : 12;
            for (let i = 0; i < count; i++) {
              const angle = (i / count) * Math.PI * 2;
              const dist = 50 + Math.random() * 40;
              const x = 90 + Math.cos(angle) * dist, y = 90 + Math.sin(angle) * dist;
              i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = isBossMode ? "rgba(180, 50, 50, 0.85)" : "rgba(100, 180, 100, 0.8)";
            ctx.fill();
            ctx.globalCompositeOperation = "source-over";

            if (isBossMode && bossHits === 0) {
              triggerBossSplash();
            }
          };
        } catch (e) { console.error("Could not load opponent", e); }
      }

      function triggerBossSplash() {
        const splash = document.getElementById("boss-splash");
        document.getElementById("boss-splash-text").innerText = `A wild BOSS ${currentBossName.toUpperCase()} appeared!`;
        splash.classList.add("active");
        setTimeout(() => {
          splash.classList.remove("active");
        }, 2500);
      }

      function nextQuestion() {
        if (qIndex >= questionBank.length) { shuffle(questionBank); qIndex = 0; }
        const currentQ = questionBank[qIndex++];
        document.getElementById("feedback").innerText = "";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("q-text").innerHTML = `${currentQ.type}: ${currentQ.q}`;
        
        const optDiv = document.getElementById("options");
        optDiv.innerHTML = "";
        currentQ.opts.forEach((o, i) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerHTML = `<span class="option-label">${["A", "B", "C", "D"][i]}</span><span>${o}</span>`;
          btn.onclick = () => checkAnswer(i === currentQ.correct, currentQ.opts[currentQ.correct]);
          optDiv.appendChild(btn);
        });
        if (window.MathJax) MathJax.typesetPromise();
      }

      function checkAnswer(isCorrect, correctText) {
        document.querySelectorAll(".option-btn").forEach(b => (b.disabled = true));
        const spriteWrapper = document.getElementById("sprite-wrapper"), oppContainer = document.getElementById("opp-container"), userContainer = document.getElementById("user-container"), feedback = document.getElementById("feedback");
        
        if (isCorrect) {
          const userRect = spriteWrapper.getBoundingClientRect(), oppRect = oppContainer.getBoundingClientRect();
          spriteWrapper.style.transform = `translate(${oppRect.left - userRect.left}px, ${oppRect.top - userRect.top}px)`;
          
          setTimeout(() => {
            oppContainer.classList.add("jiggle-effect");
            spriteWrapper.style.transform = `translate(0, 0)`;
            
            setTimeout(() => { 
              oppContainer.classList.remove("jiggle-effect"); 
              
              if (!isBossMode) {
                regularStreak++;
                if (regularStreak >= 5) {
                  isBossMode = true;
                  bossHits = 0;
                  updateOpponent();
                } else {
                  updateOpponent();
                }
              } else {
                bossHits++;
                if (bossHits >= 5) {
                  triggerVictory();
                  return;
                }
              }
            }, 600);
          }, 400);
          
          feedback.style.color = "#a5d6a7"; 
          feedback.innerHTML = isBossMode ? `Critical Hit! Boss HP Lowered (${bossHits + 1}/5)` : "Correct!"; 
          
          if (bossHits < 5) {
            document.getElementById("next-btn").style.display = "inline-block";
          }
        } else {
          const oppRect = oppContainer.getBoundingClientRect(), userRect = userContainer.getBoundingClientRect();
          oppContainer.style.transform = `translate(${userRect.left - oppRect.left}px, ${userRect.top - oppRect.top}px)`;
          
          setTimeout(() => {
            userContainer.classList.add("jiggle-effect");
            oppContainer.style.transform = `translate(0, 0)`;
            setTimeout(() => userContainer.classList.remove("jiggle-effect"), 600);
          }, 400);
          
          feedback.style.color = "#ef9a9a"; 
          feedback.innerHTML = "Incorrect! " + correctText; 
          
          let damage = isBossMode ? 40 : 20;
          userHp = Math.max(0, userHp - damage); 
          document.getElementById("user-hp").style.width = userHp + "%";
          
          if (userHp <= 0) triggerGameOver(); else document.getElementById("next-btn").style.display = "inline-block";
        }
        if (window.MathJax) MathJax.typesetPromise();
      }

      function triggerVictory() {
        // Clear and hide defeated Boss
        const canvas = document.getElementById("opp-canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById("opp-name").style.visibility = "hidden";

        // Display updated victory message
        document.getElementById("feedback").style.color = "#ffd700";
        document.getElementById("feedback").innerHTML = "<span style='font-size:2.2em; font-family:Impact,sans-serif; letter-spacing:2px; color:#ffeb3b;'>VICTORY!</span><br><br><button class='btn btn-large yellow darken-3' onclick='location.reload()'>Play Again</button>";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("options").innerHTML = "";
        document.getElementById("q-text").innerText = "";

        // Spawn cheering Pokémon on left and right side of screen
        spawnCelebrationParty();
      }

      async function spawnCelebrationParty() {
        // Choose a few random IDs from your horde list to join the party
        const partyIds = [...horde];
        shuffle(partyIds);
        const selectedParty = partyIds.slice(0, 6); // Grab 6 random ones

        selectedParty.forEach(async (id, index) => {
          try {
            const data = await getPokemonData(id);
            const img = document.createElement("img");
            img.src = data.sprites.front_default;
            img.className = "party-pokemon";
            
            // Alternates positioning between left flank and right flank
            if (index % 2 === 0) {
              img.style.left = `${20 + (index * 25)}px`;
            } else {
              img.style.right = `${20 + ((index - 1) * 25)}px`;
            }
            
            // Randomly staggers heights and jumping speeds to make the bouncing look natural
            img.style.top = `${100 + Math.random() * 150}px`;
            img.style.animationDelay = `${Math.random() * 0.5}s`;
            img.style.animationDuration = `${0.4 + Math.random() * 0.4}s`;
            
            document.body.appendChild(img);
          } catch(e) { console.error(e); }
        });
      }

      function triggerGameOver() {
        document.getElementById("feedback").innerHTML = "GAME OVER!<br><button class='btn' onclick='location.reload()'>Restart Game</button>";
        document.getElementById("next-btn").style.display = "none";
      }

      async function init() {
        shuffle(questionBank);
        try {
          const userData = await getPokemonData(playerPokemon);
          document.getElementById("user-sprite").src = userData.sprites.front_default;
          document.getElementById("user-name").innerText = userData.name;
          await updateOpponent();
          nextQuestion();
        } catch (e) { document.getElementById("q-text").innerText = "Error loading game data."; }
      }
      init();
    </script>
  </body>
</html>
