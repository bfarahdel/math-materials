<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exponent Visualization: 2³</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen p-4">

    <div class="bg-gray-900 p-8 rounded-2xl shadow-xl w-full max-w-2xl text-center border border-gray-800">
        <h1 class="text-3xl font-bold text-white mb-6">Exponents</h1>
        
        <div class="my-6 flex justify-center items-center">
            <div class="flex items-start">
                <div class="flex flex-col items-center">
                    <span class="text-7xl text-blue-400 font-bold leading-none">2</span>
                </div>
                <div class="flex flex-col items-center -mt-2">
                    <span class="text-3xl text-red-400 font-bold leading-none">3</span>
                </div>
            </div>
            <div id="solution-text" class="text-5xl font-bold text-green-400 ml-4 hidden">
                = 8
            </div>
        </div>

        <!-- Marill Visualization Area -->
        <div id="visual-area" class="flex flex-row flex-wrap justify-center items-center gap-2 my-2 min-h-[140px] w-full">
            <!-- Marill images will be injected here -->
        </div>

        <div id="description" class="bg-gray-800 p-6 rounded-xl border border-gray-700 min-h-[120px] flex flex-col justify-center">
            <div id="info-text" class="text-xl text-gray-200 text-left space-y-2">
                <div class="font-bold mb-2 text-white">Pronunciation:</div>
                <ul class="list-disc list-inside space-y-2">
                    <li>"two to the power of 3"</li>
                    <li>"two cubed"</li>
                </ul>
            </div>
        </div>

        <div class="mt-6">
            <button onclick="showSolution()" class="w-full px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold transition-colors">Show Solution</button>
            <button onclick="reset()" class="w-full mt-3 px-4 py-3 bg-gray-700 text-gray-200 rounded-lg hover:bg-gray-600 transition-colors">Reset</button>
        </div>
    </div>

    <script>
        const visualArea = document.getElementById('visual-area');
        
        async function fetchMarill() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon/marill');
                const data = await response.json();
                const imgUrl = data.sprites.front_default;
                // Initial base value is 2
                renderMarills(2, imgUrl);
            } catch (e) {
                console.error("Failed to fetch Marill");
            }
        }

        function renderMarills(count, url) {
            visualArea.innerHTML = "";
            for (let i = 0; i < count; i++) {
                const img = document.createElement('img');
                img.src = url;
                img.alt = "Marill";
                img.className = "w-20 h-20 animate-bounce shrink-0";
                visualArea.appendChild(img);
            }
        }

        function showSolution() {
            document.getElementById('solution-text').classList.remove('hidden');
            fetch('https://pokeapi.co/api/v2/pokemon/marill')
                .then(r => r.json())
                .then(data => renderMarills(8, data.sprites.front_default));
        }

        function reset() {
            document.getElementById('solution-text').classList.add('hidden');
            fetchMarill();
        }

        fetchMarill();
    </script>
</body>
</html>
