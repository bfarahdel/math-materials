<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pika Island Survival</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']]
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
        }
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
  </head>
  <body class="bg-gray-900 min-h-screen flex flex-col items-center p-4 text-white">
    <div id="story-screen" class="bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-2xl text-center">
      <h1 class="text-4xl font-bold text-red-500 mb-6">Pika Island in Danger!</h1>
      <p class="text-lg text-gray-300 mb-8">
        Team Rocket has invaded Pika Island! The population of Pikachu is <b>declining exponentially</b>. Help us save them!
      </p>
      <button onclick="showGame()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3 px-8 rounded-full text-lg">
        Start Saving Pikachus!
      </button>
    </div>

    <div id="game-screen" class="hidden bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-2xl flex flex-col items-center">
      <h2 class="text-2xl font-bold text-red-500 mb-2">Pikachu Population Decay</h2>
      <p class="mb-4 text-gray-400 text-sm text-center">Click the red points to see the remaining free pikachu.</p>
      <canvas id="graphCanvas" class="w-full h-80 bg-gray-700 rounded-lg border-b-2 border-l-2 border-gray-500 mb-4 cursor-pointer"></canvas>
      <p id="info-text" class="text-xl font-bold text-red-500 mb-4 min-h-[30px]"></p>
      <div id="population-count" class="flex flex-wrap justify-center gap-2 mt-4 min-h-[64px]"></div>
      <button id="collect-btn" onclick="startQuiz()" class="hidden mt-6 bg-green-600 hover:bg-green-700 px-6 py-2 rounded-full font-bold">
        Start Collecting Pikachu
      </button>
    </div>

    <div id="quiz-screen" class="hidden bg-gray-800 p-10 rounded-2xl shadow-xl w-full max-w-2xl text-center">
      <div class="mb-6 p-4 bg-gray-900 border border-yellow-500 rounded max-w-xs mx-auto text-center">
        <span class="text-yellow-400 font-bold text-sm block uppercase tracking-wider mb-1">Pikachus Saved</span>
        <span id="collected-indicator" class="text-4xl text-green-500 font-bold">0</span>
        <span class="text-gray-500 text-2xl"> / 8</span>
      </div>
      
      <h3 id="category-title" class="text-3xl font-bold text-blue-400 mb-4"></h3>
      <p id="question-text" class="text-2xl mb-8 font-bold"></p>
      <div id="options-area" class="grid grid-cols-1 gap-4"></div>
      <p id="feedback" class="mt-6 text-xl font-bold min-h-[30px]"></p>
      <div id="explanation-area" class="mt-6 p-6 bg-gray-700 rounded text-gray-100 text-lg hidden">
        <p id="explanation-text"></p>
      </div>
      <button id="next-btn" onclick="nextQuestion()" class="hidden mt-8 bg-yellow-500 hover:bg-yellow-600 px-8 py-3 rounded-lg text-lg font-bold text-gray-900">
        Next Question
      </button>
    </div>

    <script>
      const canvas = document.getElementById("graphCanvas");
      const ctx = canvas.getContext("2d");
      const infoText = document.getElementById("info-text");
      const popContainer = document.getElementById("population-count");
      const collectBtn = document.getElementById("collect-btn");
      let pikachuSpriteUrl = "";
      let collectedCount = 0;
      let currentIdx = 0;

      function fetchSprite() {
        return new Promise((resolve) => {
          resolve("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png");
        });
      }

      const points = [
        { x: 0, y: 8, l: "8 Pikachu" }, 
        { x: 1, y: 4, l: "4 Pikachu" },
        { x: 2, y: 2, l: "2 Pikachu" }, 
        { x: 3, y: 1, l: "1 Pikachu" }
      ];

      let questions = [
        // --- EVALUATING LOGARITHMS ---
        { q: "Evaluate \\(\\log_2(8)\\)", a: ["3", "4", "2"], c: "3", cat: "Evaluating Logarithms", exp: "Because \\(2^3 = 8\\), \\(\\log_2(8) = 3\\)." },
        { q: "Evaluate \\(\\log_5(25)\\)", a: ["2", "5", "1"], c: "2", cat: "Evaluating Logarithms", exp: "Because \\(5^2 = 25\\), \\(\\log_5(25) = 2\\)." },
        { q: "Evaluate \\(\\log_3(9)\\)", a: ["2", "3", "6"], c: "2", cat: "Evaluating Logarithms", exp: "Because \\(3^2 = 9\\), \\(\\log_3(9) = 2\\)." },
        { q: "Evaluate \\(\\log_{10}(100)\\)", a: ["2", "10", "20"], c: "2", cat: "Evaluating Logarithms", exp: "Because \\(10^2 = 100\\), \\(\\log_{10}(100) = 2\\)." },
        { q: "Evaluate \\(\\log_4(64)\\)", a: ["3", "4", "16"], c: "3", cat: "Evaluating Logarithms", exp: "Because \\(4^3 = 64\\), \\(\\log_4(64) = 3\\)." },
        { q: "Evaluate \\(\\log_2(16)\\)", a: ["4", "8", "2"], c: "4", cat: "Evaluating Logarithms", exp: "Because \\(2^4 = 16\\), \\(\\log_2(16) = 4\\)." },

        // --- PRODUCT PROPERTY ---
        { q: "Expand the product: \\(\\log_3(4 \\cdot 7)\\)", a: ["\\(\\log_3(4) + \\log_3(7)\\)", "\\(\\log_3(4) - \\log_3(7)\\)", "\\(\\log_3(4) \\cdot \\log_3(7)\\)"], c: "\\(\\log_3(4) + \\log_3(7)\\)", cat: "Product Property", exp: "The Product Property states that a product inside splits into addition: \\(\\log_3(4 \\cdot 7) = \\log_3(4) + \\log_3(7)\\)." },
        { q: "Expand the product: \\(\\log_2(5 \\cdot 9)\\)", a: ["\\(\\log_2(5) + \\log_2(9)\\)", "\\(\\log_2(45)\\)", "\\(\\log_2(5) - \\log_2(9)\\)"], c: "\\(\\log_2(5) + \\log_2(9)\\)", cat: "Product Property", exp: "The Product Property changes multiplication into addition: \\(\\log_2(5 \\cdot 9) = \\log_2(5) + \\log_2(9)\\)." },
        { q: "Expand the product: \\(\\log_{10}(2 \\cdot 3)\\)", a: ["\\(\\log_{10}(2) + \\log_{10}(3)\\)", "\\(\\log_{10}(2) \\cdot \\log_{10}(3)\\)", "\\(\\log_{10}(5)\\)"], c: "\\(\\log_{10}(2) + \\log_{10}(3)\\)", cat: "Product Property", exp: "Splitting multiplied items transforms them into added items: \\(\\log_{10}(2 \\cdot 3) = \\log_{10}(2) + \\log_{10}(3)\\)." },

        // --- QUOTIENT PROPERTY ---
        { q: "Expand the quotient: \\(\\log_4(9/2)\\)", a: ["\\(\\log_4(9) - \\log_4(2)\\)", "\\(\\log_4(9) + \\log_4(2)\\)", "\\(\\frac{\\log_4(9)}{\\log_4(2)}\\)"], c: "\\(\\log_4(9) - \\log_4(2)\\)", cat: "Quotient Property", exp: "The Quotient Property splits division inside a log into subtraction: \\(\\log_4(9/2) = \\log_4(9) - \\log_4(2)\\)." },
        { q: "Expand the quotient: \\(\\log_5(7/3)\\)", a: ["\\(\\log_5(7) - \\log_5(3)\\)", "\\(\\log_5(7) + \\log_5(3)\\)", "\\(\\log_5(4)\\)"], c: "\\(\\log_5(7) - \\log_5(3)\\)", cat: "Quotient Property", exp: "Division inside the log converts into subtraction: \\(\\log_5(7/3) = \\log_5(7) - \\log_5(3)\\)." },
        { q: "Expand the quotient: \\(\\log_2(5/7)\\)", a: ["\\(\\log_2(5) - \\log_2(7)\\)", "\\(\\log_2(7) - \\log_2(5)\\)", "\\(\\log_2(5) + \\log_2(7)\\)"], c: "\\(\\log_2(5) - \\log_2(7)\\)", cat: "Quotient Property", exp: "Numerator log minus denominator log: \\(\\log_2(5/7) = \\log_2(5) - \\log_2(7)\\)." },
        { q: "Expand the quotient: \\(\\log_b(5/3)\\)", a: ["\\(\\log_b(5) - \\log_b(3)\\)", "\\(\\log_b(5) + \\log_b(3)\\)", "\\(\\frac{\\log_b(5)}{\\log_b(3)}\\)"], c: "\\(\\log_b(5) - \\log_b(3)\\)", cat: "Quotient Property", exp: "The division fraction expands into simple subtraction: \\(\\log_b(5/3) = \\log_b(5) - \\log_b(3)\\)." },

        // --- POWER PROPERTY ---
        { q: "Expand the power: \\(\\log_{10}(3^4)\\)", a: ["\\(4 \\cdot \\log_{10}(3)\\)", "\\(\\log_{10}(12)\\)", "\\(\\log_{10}(3) + 4\\)"], c: "\\(4 \\cdot \\log_{10}(3)\\)", cat: "Power Property", exp: "The Power Property pulls the exponent to the front as a multiplier: \\(\\log_{10}(3^4) = 4 \\cdot \\log_{10}(3)\\)." },
        { q: "Expand the power: \\(\\log_3(2^5)\\)", a: ["\\(5 \\cdot \\log_3(2)\\)", "\\(2 \\cdot \\log_3(5)\\)", "\\(\\log_3(10)\\)"], c: "\\(5 \\cdot \\log_3(2)\\)", cat: "Power Property", exp: "The exponent 5 steps down to become a multiplier: \\(\\log_3(2^5) = 5 \\cdot \\log_3(2)\\)." },
        { q: "Expand the power: \\(\\log_5(7^2)\\)", a: ["\\(2 \\cdot \\log_5(7)\\)", "\\(\\log_5(14)\\)", "\\(\\log_5(7) + 2\\)"], c: "\\(2 \\cdot \\log_5(7)\\)", cat: "Power Property", exp: "The power rule shifts the exponent out front: \\(\\log_5(7^2) = 2 \\cdot \\log_5(7)\\)." }
      ];

      function shuffleQuestions() {
        for (let i = questions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [questions[i], questions[j]] = [questions[j], questions[i]];
        }
      }

      async function showGame() {
        document.getElementById("story-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        try {
          pikachuSpriteUrl = await fetchSprite();
          drawGraph();
          shuffleQuestions();
        } catch (e) {
          infoText.innerText = "Error loading game assets.";
        }
      }

      function drawGraph() {
        const w = (canvas.width = canvas.offsetWidth);
        const h = (canvas.height = canvas.offsetHeight);
        const p = 60;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#9ca3af";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("Population", 10, 25);
        ctx.fillText("Generation", w - 120, h - 5);
        ctx.beginPath();
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 4;
        
        for (let x = 0; x <= 3; x += 0.05) {
          let px = p + (x / 3) * (w - 2 * p);
          let py = h - p - ((8 * Math.pow(0.5, x)) / 8) * (h - 2 * p);
          x == 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
        
        points.forEach((pt) => {
          let px = p + (pt.x / 3) * (w - 2 * p);
          let py = h - p - (pt.y / 8) * (h - 2 * p);
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.arc(px, py, 10, 0, 7);
          ctx.fill();
          ctx.fillStyle = "white";
          ctx.fillText(pt.l, px - 25, py - 20);
        });
      }

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        points.forEach((pt) => {
          let px = 60 + (pt.x / 3) * (canvas.width - 120);
          let py = canvas.height - 60 - (pt.y / 8) * (canvas.height - 120);
          if (Math.hypot(mx - px, my - py) < 30) {
            infoText.innerText = `Remaining Pikachu: ${pt.y}`;
            renderPikachus(pt.y);
            collectBtn.classList.remove("hidden");
          }
        });
      };

      function renderPikachus(count) {
        popContainer.innerHTML = "";
        for (let i = 0; i < count; i++) {
          const img = document.createElement("img");
          img.src = pikachuSpriteUrl;
          img.className = "w-12 h-12";
          popContainer.appendChild(img);
        }
      }

      function startQuiz() {
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
      }

      function loadQuestion() {
        let q = questions[currentIdx];
        document.getElementById("category-title").innerText = q.cat;
        document.getElementById("question-text").innerHTML = q.q;
        let area = document.getElementById("options-area");
        area.innerHTML = "";
        q.a.forEach((opt) => {
          let btn = document.createElement("button");
          btn.className = "option-btn bg-gray-700 p-4 rounded-lg hover:bg-gray-600 transition text-lg w-full border-2 border-transparent";
          btn.innerHTML = opt;
          btn.onclick = () => checkAnswer(btn, opt, q.c);
          area.appendChild(btn);
        });
        
        if (window.MathJax && window.MathJax.typesetPromise) {
          MathJax.typesetPromise();
        }
      }

      function checkAnswer(clickedBtn, sel, cor) {
        // Immediately disable all buttons to completely freeze alternative guesses
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => {
          btn.disabled = true;
          btn.classList.remove("hover:bg-gray-600");
          btn.classList.add("opacity-60", "cursor-not-allowed");
          
          // Visually outline the actual correct answer on the screen
          if (btn.innerHTML === cor) {
            btn.classList.remove("opacity-60");
            btn.classList.add("border-green-500", "bg-gray-800");
          }
        });

        document.getElementById("explanation-area").classList.remove("hidden");
        const feedback = document.getElementById("feedback");
        
        if (sel === cor) {
          collectedCount++;
          feedback.innerText = "Correct!";
          feedback.className = "mt-6 font-bold text-xl min-h-[30px] text-green-500";
          document.getElementById("collected-indicator").innerText = collectedCount;
        } else {
          feedback.innerText = "Incorrect.";
          feedback.className = "mt-6 font-bold text-xl min-h-[30px] text-red-500";
          clickedBtn.classList.add("border-red-500");
        }
        
        document.getElementById("explanation-text").innerHTML = "Explanation: " + questions[currentIdx].exp;
        document.getElementById("next-btn").classList.remove("hidden");
        
        if (window.MathJax && window.MathJax.typesetPromise) {
          MathJax.typesetPromise();
        }
      }

      function nextQuestion() {
        if (collectedCount >= 8) {
          showFinal(true);
          return;
        }

        currentIdx++;
        if (currentIdx < questions.length) {
          document.getElementById("next-btn").classList.add("hidden");
          document.getElementById("explanation-area").classList.add("hidden");
          document.getElementById("feedback").innerText = ""; 
          loadQuestion();
        } else {
          showFinal(false);
        }
      }

      function showFinal(isWin) {
        if (isWin) {
          document.getElementById("quiz-screen").innerHTML = `
            <h2 class="text-4xl text-green-400 font-bold mb-4">YOU WIN!</h2>
            <p class="text-xl text-gray-300 mb-4">Awesome job! You successfully saved all 8 Pikachus!</p>
            <div id="result-sprites" class="flex flex-wrap justify-center my-8 gap-4"></div>
            <button onclick="location.reload()" class="bg-yellow-500 text-gray-900 text-xl font-bold px-10 py-4 rounded-full">Play Again</button>
          `;
          let container = document.getElementById("result-sprites");
          for (let i = 0; i < 8; i++) {
            let img = document.createElement("img");
            img.src = pikachuSpriteUrl;
            img.className = "w-20 h-20";
            container.appendChild(img);
          }
        } else {
          document.getElementById("quiz-screen").innerHTML = `
            <h2 class="text-4xl text-red-500 font-bold mb-4">GAME OVER</h2>
            <p class="text-xl text-gray-300 mb-6">You ran out of questions and only saved ${collectedCount} Pikachu. You need 8 correct answers to win!</p>
            <button onclick="location.reload()" class="bg-red-600 hover:bg-red-700 text-white text-xl font-bold px-10 py-4 rounded-full">Try Again</button>
          `;
        }
      }
    </script>
  </body>
</html>
