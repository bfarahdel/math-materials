<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Population Growth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        document.getElementById('math-container').classList.remove('hidden');
                    });
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center p-4">

    <header class="text-center mb-6">
        <h1 class="text-3xl font-bold text-yellow-400">Pikachu Population Growth</h1>
        <!-- Hidden until MathJax renders -->
        <div id="math-container" class="hidden">
            <p class="text-2xl text-yellow-500 mt-4 font-mono">$$f(x) = 2^x$$</p>
        </div>
    </header>

    <div class="bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-2xl flex flex-col items-center">
        <div id="loading" class="text-yellow-500 font-semibold mb-4">Fetching Pikachu data...</div>
        
        <div id="content" class="hidden flex flex-col items-center w-full">
            <div class="mb-6 text-center">
                <p id="info-text" class="text-2xl font-bold text-green-500 mb-2 min-h-[40px]"></p>
            </div>

            <canvas id="graphCanvas" class="w-full h-96 border-b-2 border-l-2 border-gray-600 mb-4"></canvas>
            
            <div id="population-count" class="flex flex-wrap justify-center gap-2 mt-4 min-h-[64px]">
                <!-- Pikachu sprites will appear here -->
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const infoText = document.getElementById('info-text');
        const popContainer = document.getElementById('population-count');
        let pikachuSpriteUrl = '';
        let selectedPointIndex = -1;
        
        const points = [
            { x: 0, y: 1, label: '(0, 1)' },
            { x: 1, y: 2, label: '(1, 2)' },
            { x: 2, y: 4, label: '(2, 4)' },
            { x: 3, y: 8, label: '(3, 8)' },
            { x: 4, y: 16, label: '(4, 16)' }
        ];

        async function init() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon/pikachu');
                const data = await response.json();
                pikachuSpriteUrl = data.sprites.front_default;
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                drawGraph();
            } catch (err) {
                document.getElementById('loading').innerText = "Failed to load Pikachu data.";
            }
        }

        function drawGraph() {
            const w = canvas.width = canvas.offsetWidth;
            const h = canvas.height = canvas.offsetHeight;
            const padding = 60;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#9ca3af";
            ctx.font = "bold 24px sans-serif";

            ctx.fillText("Population", 10, 30);
            ctx.fillText("Generations", w - 160, h - 10);

            ctx.beginPath();
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            
            // Loop extended to 4.5 to create a longer trail effect past the final data point
            for(let x = 0; x <= 4.5; x += 0.05) {
                const px = padding + (x / 4) * (w - padding * 2);
                const py = (h - padding) - ((Math.pow(2, x) / 16) * (h - padding * 2));
                x === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.stroke();

            points.forEach((p, index) => {
                const px = padding + (p.x / 4) * (w - padding * 2);
                const py = (h - padding) - ((p.y / 16) * (h - padding * 2));
                
                ctx.fillStyle = (index === selectedPointIndex) ? '#22c55e' : '#ef4444';
                ctx.beginPath();
                ctx.arc(px, py, 12, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px sans-serif";
                ctx.fillText(p.label, px - 30, py + 40);
            });
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const padding = 60;

            points.forEach((p, index) => {
                const px = padding + (p.x / 4) * (canvas.width - padding * 2);
                const py = (canvas.height - padding) - ((p.y / 16) * (canvas.height - padding * 2));
                
                if (Math.hypot(mouseX - px, mouseY - py) < 30) {
                    selectedPointIndex = index;
                    infoText.style.color = '#22c55e';
                    infoText.innerText = `Generation ${p.x}: ${p.y} Pikachu`;
                    renderPikachus(p.y);
                    drawGraph();
                }
            });
        });

        function renderPikachus(count) {
            popContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const img = document.createElement('img');
                img.src = pikachuSpriteUrl;
                img.className = 'w-16 h-16';
                popContainer.appendChild(img);
            }
        }

        window.addEventListener('resize', drawGraph);
        init();
    </script>
</body>
</html>
