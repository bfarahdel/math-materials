<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOH-CAH-TOA Interactive Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e293b;
            font-family: 'Merriweather', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .presentation-frame {
            width: 1280px;
            height: 720px;
            background-color: #fcfcf9;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .textbook-header {
            background-color: #3b82f6; 
            display: flex;
            align-items: stretch;
            height: 75px;
            border-bottom: 2px solid #cbd5e1;
            transition: background-color 0.4s ease;
        }

        .header-tag {
            font-weight: 700;
            font-size: 34px;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 45px;
            border-right: 2px solid rgba(255, 255, 255, 0.2);
        }

        .header-title {
            font-weight: 400;
            font-size: 34px;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding-left: 35px;
        }

        .workspace {
            padding: 40px 80px 10px 80px;
            height: 480px; /* Locked height to prevent vertical shifting */
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            overflow: hidden;
        }

        .content-area {
            width: 720px;
            display: flex;
            flex-direction: column;
        }

        .visual-area {
            width: 360px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .explanation-card {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 30px;
            border: 1px solid #e2e8f0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }

        .formula-title {
            font-family: 'Roboto', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .math-element {
            font-size: 42px;
            color: #000000;
            display: flex;
            align-items: center;
            font-family: 'Merriweather', serif;
        }

        .math-frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 12px;
            line-height: 1;
        }
        .math-num {
            padding-bottom: 6px;
            transition: color 0.3s;
        }
        .math-den {
            border-top: 3px solid #000000;
            padding-top: 8px;
            transition: color 0.3s;
        }

        .text-desc {
            font-family: 'Roboto', sans-serif;
            font-size: 20px;
            color: #475569;
            margin-top: 25px;
            line-height: 1.6;
        }

        /* Fixed Button Row Placed Under the Workspace Layout */
        .bottom-interactive-bar {
            width: 100%;
            display: flex;
            justify-content: center; /* Enforces absolute horizontal centering on the overall screen */
            align-items: center;
            padding-bottom: 45px;
            margin-top: auto;
        }

        .mnemonic-container {
            display: flex;
            gap: 24px;
        }

        .mnemonic-badge {
            font-family: 'Roboto', sans-serif;
            font-size: 32px;
            font-weight: 700;
            width: 180px; 
            padding: 12px 0; 
            border-radius: 8px;
            background-color: #e2e8f0;
            color: #64748b;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            text-align: center;
            border: none;
        }

        .mnemonic-badge.active-soh { background-color: #ef4444; color: white; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3); }
        .mnemonic-badge.active-cah { background-color: #10b981; color: white; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3); }
        .mnemonic-badge.active-toa { background-color: #f59e0b; color: white; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3); }

        /* Color Coding System */
        .color-opp { color: #3b82f6 !important; }
        .color-adj { color: #10b981 !important; }
        .color-hyp { color: #ec4899 !important; }

        /* SVG Geometry Styling Layouts */
        svg {
            filter: drop-shadow(0px 12px 24px rgba(0,0,0,0.08));
        }
        .line-edge {
            stroke: #334155;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .right-angle-box {
            fill: none;
            stroke: #64748b;
            stroke-width: 3;
        }
        .lbl-text {
            font-family: 'Roboto', sans-serif;
            font-size: 24px;
            font-weight: 700;
            fill: #64748b;
            transition: all 0.4s ease;
        }
        .angle-arc {
            fill: none;
            stroke: #f59e0b;
            stroke-width: 3;
        }

        .text-glow {
            font-size: 30px;
            fill: #000000;
        }
    </style>
</head>
<body>

<div class="presentation-frame">
    <div class="textbook-header" id="mainHeader">
        <div class="header-tag">Trigonometry</div>
        <div class="header-title">Right Triangle Ratios (SOH-CAH-TOA)</div>
    </div>

    <div class="workspace">
        <div class="content-area">
            <div class="explanation-card">
                <div class="formula-title" id="formulaTitle">Select a core concept below</div>
                
                <div class="math-element" id="mathDisplay" style="display: none;">
                    <span id="funcName">sin</span> &theta; = 
                    <div class="math-frac">
                        <span class="math-num" id="fracNum">Opposite</span>
                        <span class="math-den" id="fracDen">Hypotenuse</span>
                    </div>
                </div>

                <div class="text-desc" id="textDescription">
                    Right triangle trigonometry uses the relationships between the sharp angles and sides of a right triangle to solve structural lengths and dynamic layouts.
                </div>
            </div>
        </div>

        <div class="visual-area">
            <svg width="360" height="420" viewBox="0 0 360 420">
                <polygon points="60,30 60,350 300,350" class="line-edge" />
                <path d="M 60,325 L 85,325 L 85,350" class="right-angle-box" />
                
                <path d="M 260,350 A 40,40 0 0 0 268,312" class="angle-arc" />
                <text x="225" y="340" class="lbl-text" style="fill: #f59e0b;">&theta;</text>

                <line x1="60" y1="30" x2="60" y2="350" id="geo-opp" class="line-edge" style="stroke: transparent; stroke-width: 0;" />
                <line x1="60" y1="350" x2="300" y2="350" id="geo-adj" class="line-edge" style="stroke: transparent; stroke-width: 0;" />
                <line x1="60" y1="30" x2="300" y2="350" id="geo-hyp" class="line-edge" style="stroke: transparent; stroke-width: 0;" />

                <text x="15" y="200" id="lbl-opp" class="lbl-text">Opposite</text>
                <text x="140" y="390" id="lbl-adj" class="lbl-text">Adjacent</text>
                <text x="190" y="170" id="lbl-hyp" class="lbl-text">Hypotenuse</text>
            </svg>
        </div>
    </div>

    <div class="bottom-interactive-bar">
        <div class="mnemonic-container">
            <button class="mnemonic-badge" id="badge-soh" onclick="switchMode('soh')">SOH</button>
            <button class="mnemonic-badge" id="badge-cah" onclick="switchMode('cah')">CAH</button>
            <button class="mnemonic-badge" id="badge-toa" onclick="switchMode('toa')">TOA</button>
        </div>
    </div>
</div>

<script>
    function switchMode(mode) {
        document.getElementById('badge-soh').className = 'mnemonic-badge';
        document.getElementById('badge-cah').className = 'mnemonic-badge';
        document.getElementById('badge-toa').className = 'mnemonic-badge';
        
        resetGeometryStyles();

        const mathDisplay = document.getElementById('mathDisplay');
        mathDisplay.style.display = 'flex';

        if (mode === 'soh') {
            document.getElementById('badge-soh').classList.add('active-soh');
            document.getElementById('mainHeader').style.backgroundColor = '#ef4444';
            
            document.getElementById('formulaTitle').innerHTML = '<i class="fa-solid fa-wave-square color-opp"></i> Sine Ratio Definition';
            document.getElementById('funcName').textContent = 'sin';
            document.getElementById('fracNum').textContent = 'Opposite';
            document.getElementById('fracNum').className = 'math-num color-opp';
            document.getElementById('fracDen').textContent = 'Hypotenuse';
            document.getElementById('fracDen').className = 'math-den color-hyp';
            document.getElementById('textDescription').textContent = 'The Sine of an angle is the ratio of the length of the Opposite side to the length of the Hypotenuse.';
            
            setGeometryHighlight('geo-opp', '#3b82f6');
            setGeometryHighlight('geo-hyp', '#ec4899');
            document.getElementById('lbl-opp').classList.add('color-opp', 'text-glow');
            document.getElementById('lbl-hyp').classList.add('color-hyp', 'text-glow');
        } 
        else if (mode === 'cah') {
            document.getElementById('badge-cah').classList.add('active-cah');
            document.getElementById('mainHeader').style.backgroundColor = '#10b981';
            
            document.getElementById('formulaTitle').innerHTML = '<i class="fa-solid fa-chart-line color-adj"></i> Cosine Ratio Definition';
            document.getElementById('funcName').textContent = 'cos';
            document.getElementById('fracNum').textContent = 'Adjacent';
            document.getElementById('fracNum').className = 'math-num color-adj';
            document.getElementById('fracDen').textContent = 'Hypotenuse';
            document.getElementById('fracDen').className = 'math-den color-hyp';
            document.getElementById('textDescription').textContent = 'The Cosine of an angle is the ratio of the length of the Adjacent side to the length of the Hypotenuse.';
            
            setGeometryHighlight('geo-adj', '#10b981');
            setGeometryHighlight('geo-hyp', '#ec4899');
            document.getElementById('lbl-adj').classList.add('color-adj', 'text-glow');
            document.getElementById('lbl-hyp').classList.add('color-hyp', 'text-glow');
        } 
        else if (mode === 'toa') {
            document.getElementById('badge-toa').classList.add('active-toa');
            document.getElementById('mainHeader').style.backgroundColor = '#f59e0b';
            
            document.getElementById('formulaTitle').innerHTML = '<i class="fa-solid fa-calculator color-opp"></i> Tangent Ratio Definition';
            document.getElementById('funcName').textContent = 'tan';
            document.getElementById('fracNum').textContent = 'Opposite';
            document.getElementById('fracNum').className = 'math-num color-opp';
            document.getElementById('fracDen').textContent = 'Adjacent';
            document.getElementById('fracDen').className = 'math-den color-adj';
            document.getElementById('textDescription').textContent = 'The Tangent of an angle is the ratio of the length of the Opposite side to the length of the Adjacent side.';
            
            setGeometryHighlight('geo-opp', '#3b82f6');
            setGeometryHighlight('geo-adj', '#10b981');
            document.getElementById('lbl-opp').classList.add('color-opp', 'text-glow');
            document.getElementById('lbl-adj').classList.add('color-adj', 'text-glow');
        }
    }

    function setGeometryHighlight(elementId, color) {
        const line = document.getElementById(elementId);
        line.style.stroke = color;
        line.style.strokeWidth = '8px';
        line.style.filter = `drop-shadow(0px 0px 6px ${color})`;
    }

    function resetGeometryStyles() {
        ['geo-opp', 'geo-adj', 'geo-hyp'].forEach(id => {
            const line = document.getElementById(id);
            line.style.stroke = 'transparent';
            line.style.strokeWidth = '0';
            line.style.filter = 'none';
        });

        ['lbl-opp', 'lbl-adj', 'lbl-hyp'].forEach(id => {
            const label = document.getElementById(id);
            label.className = 'lbl-text';
        });
    }

    window.onload = function() {
        switchMode('soh');
    };
</script>

</body>
</html>
